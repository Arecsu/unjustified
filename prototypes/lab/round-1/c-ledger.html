<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Ledger — unjustified lab</title>
<link rel="stylesheet" href="./proto.css">
<style>
  :root { --page-margin: clamp(1.2rem, 5vw, 2rem); --label-col: 9rem; --label-gap: clamp(2rem, 3.5vw, 3rem); }
  body { font-size: 1rem; }
  .page {
    display: grid;
    grid-template-columns: var(--page-margin) [label-start] var(--label-col) [label-end] var(--label-gap) [content-start] minmax(0, 1fr) [content-end] var(--page-margin);
    row-gap: 2.5rem;
    padding-bottom: 6rem;
  }
  .page > * { grid-column: content; }
  .sect { grid-column: label-start / content-end; display: grid; grid-template-columns: subgrid; }
  .sect > h2 { grid-column: label; justify-self: end; text-align: right; font: inherit; text-transform: uppercase; margin: 0; line-height: 1.5; }
  .sect > .body { grid-column: content-start / content-end; min-width: 0; }

  header.sect { padding-top: 1.75rem; align-items: baseline; }
  header h2 { text-transform: none !important; }
  header .body { display: flex; gap: 1rem; flex-wrap: wrap; }
  header .body .sp { margin-left: auto; }

  .title { font-size: clamp(3rem, 9vw, 6rem); font-weight: 500; letter-spacing: -.02em; line-height: 1; margin: 0; font-variation-settings: 'opsz' 32; }

  /* Ruled cells: neighbouring outlines overlap into one rule. */
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); padding: .5px; }
  .cell { outline: 1px solid var(--fg); outline-offset: -.5px; padding: .55rem .7rem .45rem; display: grid; grid-template-columns: 1fr auto; gap: .15rem .5rem; align-items: center; min-height: 4.1rem; align-content: space-between; }
  .cell > :nth-child(1) { font-size: .8125rem; text-transform: uppercase; }
  .cell input[type='range'], .cell .sel { grid-column: 1 / -1; }
  label.cell { cursor: pointer; }
  @media (hover: hover) { .cell:hover { background: var(--paper); } }

  .out { display: grid; grid-template-columns: 1fr 1fr; gap: 0 3rem; }
  [data-view='a'] .out, [data-view='b'] .out { grid-template-columns: 1fr; }
  [data-view='a'] .col[data-col='b'], [data-view='b'] .col[data-col='a'] { display: none; }
  .col-head { border-top: var(--rule); padding-top: .5rem; margin-bottom: 1.75rem; display: flex; justify-content: space-between; font-size: .875rem; text-transform: uppercase; }
  .stats { font-size: .875rem; line-height: 1.6; text-align: right; }
  .stats td { padding-left: .75rem; }

  .summary {
    position: fixed; inset: 0 0 auto; z-index: 2;
    background: var(--fg); color: var(--bg);
    display: flex; gap: 1.25rem; overflow-x: auto; scrollbar-width: none;
    padding: .6rem var(--page-margin); font-size: .8125rem; text-transform: uppercase; white-space: nowrap;
    translate: 0 -100%; transition: translate .15s;
  }
  .summary.on { translate: 0 0; }
  .summary button { color: inherit; text-transform: inherit; }

  @media (max-width: 56em) {
    .page { grid-template-columns: var(--page-margin) [label-start content-start] minmax(0, 1fr) [label-end content-end] var(--page-margin); row-gap: 1.75rem; }
    .sect { row-gap: .6rem; }
    .sect > h2 { justify-self: start; text-align: left; }
    .sect > .body { grid-column: content; }
    .cells { grid-template-columns: 1fr 1fr; }
    .out { grid-template-columns: 1fr; gap: 2.5rem; }
    .stats { text-align: left; }
    .stats td:first-child { padding-left: 0; }
  }
</style>
</head>
<body>
<div class="summary num"></div>
<div class="page">
  <header class="sect">
    <h2>alejandro r.</h2>
    <div class="body"><span>unjustified</span><span>/</span><span>lab</span><a class="hl sp" href="./index.html" style="color:inherit;text-decoration:none">↙ prototypes</a></div>
  </header>
  <h1 class="title">unjustified lab</h1>
  <div class="controls" style="display:contents"></div>
  <section class="sect" id="view">
    <h2>View</h2>
    <div class="body up" style="display:flex;gap:1rem">
      <button class="hl" data-view-set="a">A only</button><button class="hl" data-view-set="b">B only</button><button class="hl" data-view-set="ab">A + B</button>
      <span style="margin-left:auto;display:flex;gap:1rem"><button class="hl up">Edit text</button></span>
    </div>
  </section>
  <section class="sect">
    <h2>Output<table class="stats num" style="margin-top:.5rem"><tr><td></td><td>A</td><td>B</td></tr><tr><td>Lines</td><td data-m="a.lines"></td><td data-m="b.lines"></td></tr><tr><td>Rag σ</td><td data-m="a.dev"></td><td data-m="b.dev"></td></tr><tr><td>Short</td><td data-m="a.short"></td><td data-m="b.short"></td></tr></table></h2>
    <div class="body out">
      <section class="col" data-col="a"><div class="col-head"><span>A</span><span>Browser</span></div><div class="text" data-col="a"></div></section>
      <section class="col" data-col="b"><div class="col-head"><span>B</span><span>Unjustified</span></div><div class="text" data-col="b"></div></section>
    </div>
  </section>
</div>

<script type="module">
  import { GROUPS, CONTROLS, inputHTML, valueHTML, format, onChange, start } from './proto.js';
  const controls = document.querySelector('.controls');
  controls.outerHTML = `<div class="ledger" style="display:contents">${GROUPS.map(g => `<section class="sect"><h2>${g.label}</h2><div class="body cells">${g.controls.map(c => c.type === 'toggle'
    ? `<label class="cell"><span>${c.label}</span>${inputHTML(c)}<span class="muted" style="font-size:.8125rem">${c.k === 'justify' ? 'Overrides edge' : ''}</span></label>`
    : `<div class="cell"><span>${c.label}</span>${c.type === 'range' ? valueHTML(c) : '<span></span>'}${inputHTML(c)}</div>`).join('')}</div></section>`).join('')}</div>`;

  const keys = ['size', 'measure', 'ls', 'rag', 'firmness', 'sync', 'shrink', 'stretch', 'hyphenate'];
  const summary = document.querySelector('.summary');
  const paint = () => summary.innerHTML = keys.map(k => `<span>${CONTROLS[k].short} ${format(k)}</span>`).join('') + `<button style="margin-left:auto">↑ Controls</button>`;
  paint();
  onChange(paint);
  summary.addEventListener('click', e => { if (e.target.closest('button')) document.querySelector('.ledger .sect').scrollIntoView({ behavior: 'smooth' }); });
  const lastGroup = document.querySelector('#view');
  new IntersectionObserver(([e]) => summary.classList.toggle('on', !e.isIntersecting && e.boundingClientRect.top < 0)).observe(lastGroup);
  start('ab');
</script>
</body>
</html>
