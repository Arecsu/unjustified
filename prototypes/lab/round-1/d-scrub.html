<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · Scrub — unjustified lab</title>
<link rel="stylesheet" href="./proto.css">
<style>
  body { padding: 0 2rem 6rem; }
  .top { display: flex; gap: 1rem; align-items: baseline; padding: 1.25rem 0; }
  .top .sp { margin-left: auto; display: flex; gap: 1rem; }

  .spec {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    border-block: var(--rule);
    padding: .6rem 0;
    font-size: .9375rem;
    line-height: 2;
  }
  .spec .line { display: flex; flex-wrap: wrap; column-gap: 1.1rem; align-items: baseline; }
  .spec .g { width: 5.5rem; text-transform: uppercase; font-size: .8125rem; }
  .tok {
    position: relative;
    cursor: ew-resize;
    user-select: none;
    touch-action: pan-y;
    white-space: nowrap;
    padding: 0 .15em;
  }
  .tok i { font-style: normal; color: var(--fg-2); margin-right: .3em; }
  .tok[data-type='toggle'], .tok[data-type='select'] { cursor: pointer; }
  .tok[data-type='toggle'][data-on='false'] output { color: var(--fg-3); }
  /* How far along its range the value sits. */
  .tok::after { content: ''; position: absolute; left: .15em; bottom: .2em; height: 2px; width: calc((100% - .3em) * var(--p, 0)); background: var(--fg); }
  .tok[data-type='toggle']::after, .tok[data-type='select']::after { display: none; }
  @media (hover: hover) { .tok:hover { background: var(--fg); color: var(--bg); } .tok:hover i { color: var(--fg-3); } .tok:hover::after { background: var(--bg); } }
  .tok.drag { background: var(--fg); color: var(--bg); }
  .tok:focus-visible { outline-offset: 0; }
  .hint { font-size: .8125rem; color: var(--fg-2); margin-top: .25rem; }

  .canvas { display: flex; gap: 4rem; flex-wrap: wrap; padding-top: 2.5rem; }
  [data-view='a'] .col[data-col='b'], [data-view='b'] .col[data-col='a'] { display: none; }
  .col-head { font-size: .8125rem; text-transform: uppercase; display: flex; justify-content: space-between; gap: 1rem; border-bottom: var(--rule); padding-bottom: .4rem; margin-bottom: 1.5rem; }
  .frame { position: relative; width: fit-content; }
  .handle {
    position: absolute; top: -.5rem; bottom: -.5rem; right: -1rem; width: 1rem;
    cursor: col-resize; touch-action: none;
    display: grid; place-items: center;
  }
  .handle::before { content: ''; position: absolute; inset: 0 auto 0 50%; border-left: 1px dashed var(--fg); }
  .handle span { background: var(--bg); position: relative; font-size: .8125rem; padding: .2rem 0; }
  @media (hover: hover) { .handle:hover::before { border-left-style: solid; } }

  @media (max-width: 56em) {
    body { padding: 0 1.25rem 4rem; }
    .spec .g { width: 100%; margin-top: .25rem; line-height: 1.6; }
    .spec.closed .line:nth-child(n+3) { display: none; }
    .canvas { gap: 3rem; }
    .handle { right: -1.1rem; }
  }
</style>
</head>
<body>
<div class="top">
  <b style="font-weight:500">unjustified</b><span class="muted">lab</span>
  <span class="sp up" style="font-size:.8125rem">
    <button class="hl" data-view-set="a">A</button><button class="hl" data-view-set="b">B</button><button class="hl" data-view-set="ab">A+B</button>
    <a class="hl" href="./index.html" style="color:inherit;text-decoration:none">↙</a>
  </span>
</div>
<div class="spec num"></div>
<p class="hint">Drag a value sideways. Click on/off and options. Arrow keys work too. Drag the dashed edge to set the width.</p>

<main class="canvas">
  <section class="col" data-col="a"><div class="col-head"><span>A — Browser</span><span class="num muted"><span data-m="a.lines"></span> ln · σ <span data-m="a.dev"></span> · short <span data-m="a.short"></span></span></div><div class="frame"><div class="text" data-col="a"></div></div></section>
  <section class="col" data-col="b"><div class="col-head"><span>B — Unjustified</span><span class="num muted"><span data-m="b.lines"></span> ln · σ <span data-m="b.dev"></span> · short <span data-m="b.short"></span></span></div><div class="frame"><div class="text" data-col="b"></div><div class="handle" title="Width"><span>↔</span></div></div></section>
</main>

<script type="module">
  import { GROUPS, CONTROLS, state, set, format, onChange, start } from './proto.js';
  const spec = document.querySelector('.spec');
  spec.innerHTML = GROUPS.map(g => `<div class="line"><span class="g">${g.label}${g.id === 'text' ? ' <button class="hl more" style="display:none">+</button>' : ''}</span>${g.controls.map(c =>
    `<span class="tok" tabindex="0" data-tok="${c.k}" data-type="${c.type}"><i>${c.short.toLowerCase()}</i><output data-v="${c.k}">${format(c.k)}</output></span>`).join('')}</div>`).join('');

  const paint = () => {
    for (const t of spec.querySelectorAll('.tok')) {
      const c = CONTROLS[t.dataset.tok];
      if (c.type === 'range') t.style.setProperty('--p', (state[c.k] - c.min) / (c.max - c.min));
      if (c.type === 'toggle') t.dataset.on = state[c.k];
    }
  };
  paint();
  onChange(paint);

  const nudge = (c, dir) => {
    if (c.type === 'range') set(c.k, state[c.k] + dir * c.step);
    else if (c.type === 'toggle') set(c.k, !state[c.k]);
    else { const i = c.options.indexOf(state[c.k]); set(c.k, c.options[(i + dir + c.options.length) % c.options.length]); }
  };

  // Scrub: the whole range spans 320px of travel, whatever the step.
  spec.addEventListener('pointerdown', e => {
    const t = e.target.closest('.tok');
    if (!t) return;
    const c = CONTROLS[t.dataset.tok];
    if (c.type !== 'range') { nudge(c, e.shiftKey ? -1 : 1); return; }
    const x0 = e.clientX, v0 = state[c.k];
    t.setPointerCapture(e.pointerId);
    t.classList.add('drag');
    const move = m => set(c.k, v0 + (m.clientX - x0) / 320 * (c.max - c.min));
    const up = () => { t.classList.remove('drag'); t.removeEventListener('pointermove', move); };
    t.addEventListener('pointermove', move);
    t.addEventListener('pointerup', up, { once: true });
    t.addEventListener('pointercancel', up, { once: true });
  });
  spec.addEventListener('keydown', e => {
    const t = e.target.closest('.tok');
    if (!t) return;
    const c = CONTROLS[t.dataset.tok];
    const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, Enter: 1, ' ': 1 }[e.key];
    if (dir) { e.preventDefault(); nudge(c, (e.shiftKey && c.type === 'range' ? 5 : 1) * dir); }
  });

  // The column edge is the width control.
  const handle = document.querySelector('.handle');
  handle.addEventListener('pointerdown', e => {
    const x0 = e.clientX, w0 = state.measure;
    handle.setPointerCapture(e.pointerId);
    const move = m => set('measure', w0 + (m.clientX - x0));
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', () => handle.removeEventListener('pointermove', move), { once: true });
  });

  // Mobile: the spec collapses to its first line until opened.
  if (matchMedia('(max-width: 56em)').matches) {
    spec.classList.add('closed');
    const more = spec.querySelector('.more');
    more.style.display = '';
    more.addEventListener('click', () => { spec.classList.toggle('closed'); more.textContent = spec.classList.contains('closed') ? '+' : '−'; });
  }
  start(matchMedia('(max-width: 56em)').matches ? 'b' : 'ab');
</script>
</body>
</html>
